name: collection-service
description: A turbo collection-service brick.
version: 0.1.0+1
environment:
  mason: ^0.1.0
vars:
  collectionName:
    type: string
    description: Name of the collection (e.g. users -> UsersService) (plural).
  collectionObjectName:
    type: string
    description: Name of the DTO without 'Dto' (user -> UserDto) (singular).
