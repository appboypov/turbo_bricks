name: turbo_bricks_example
description: Example project to verify turbo_bricks generated code compiles.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  get_it: ^9.2.1
  go_router: ^17.2.2
  json_annotation: ^4.11.0
  turbo_modules:
    git:
      url: git@github.com:appboypov/turbo_modules.git
      ref: main
  turbo_firestore_api:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_firestore_api
  turbo_mvvm:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_mvvm
  turbo_serializable:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_serializable
  turbolytics:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbolytics

dependency_overrides:
  turbo_firestore_api:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_firestore_api
  turbo_forms:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_forms
  turbo_mvvm:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_mvvm
  turbo_notifiers:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_notifiers
  turbo_response:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_response
  turbo_serializable:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbo_serializable
  turbolytics:
    git:
      url: git@github.com:appboypov/turbo_packages.git
      ref: main
      path: turbolytics

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
