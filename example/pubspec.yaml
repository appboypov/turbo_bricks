name: turbo_bricks_example
description: Example project to verify turbo_bricks generated code compiles.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  get_it: ^9.2.1
  go_router: ^17.2.2
  json_annotation: ^4.11.0
  turbo_modules:
    path: ../../../Packages/turbo_modules
  turbo_firestore_api:
    path: ../../../Packages/turbo_packages/turbo_firestore_api
  turbo_mvvm:
    path: ../../../Packages/turbo_packages/turbo_mvvm
  turbo_serializable:
    path: ../../../Packages/turbo_packages/turbo_serializable
  turbolytics:
    path: ../../../Packages/turbo_packages/turbolytics

dependency_overrides:
  turbo_firestore_api:
    path: ../../../Packages/turbo_packages/turbo_firestore_api
  turbo_forms:
    path: ../../../Packages/turbo_packages/turbo_forms
  turbo_mvvm:
    path: ../../../Packages/turbo_packages/turbo_mvvm
  turbo_notifiers:
    path: ../../../Packages/turbo_packages/turbo_notifiers
  turbo_response:
    path: ../../../Packages/turbo_packages/turbo_response
  turbo_serializable:
    path: ../../../Packages/turbo_packages/turbo_serializable
  turbolytics:
    path: ../../../Packages/turbo_packages/turbolytics

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
